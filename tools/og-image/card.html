<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* Exactly the Open Graph canvas. */
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    /* The app's own background gradient, from docs/design/DESIGN_SYSTEM.md. */
    background: linear-gradient(160deg, #0F0E2A 0%, #1A1145 40%, #0D2137 100%);
    font-family: 'Nunito', sans-serif;
    position: relative;
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 0 96px;
  }
  /* The three brand glow orbs — coral, teal, gold — soft and off to the sides. */
  .orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.22; }
  .orb.coral { width: 360px; height: 360px; background: #FF6B6B; top: -120px; right: 120px; }
  .orb.teal  { width: 420px; height: 420px; background: #4ECDC4; bottom: -180px; left: -80px; opacity: 0.16; }
  .orb.gold  { width: 300px; height: 300px; background: #FFE66D; bottom: -60px; right: -40px; opacity: 0.12; }

  .cloud { flex: 0 0 auto; width: 360px; filter: drop-shadow(0 18px 40px rgba(78,205,196,0.28)); }
  .cloud svg { width: 360px; height: 281px; overflow: visible; }

  .text { position: relative; z-index: 2; }
  .wordmark {
    font-family: 'Lilita One', sans-serif;
    font-size: 96px;
    line-height: 1;
    background: linear-gradient(120deg, #4ECDC4 0%, #7C6BF5 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.5px;
  }
  .tagline {
    font-weight: 900;
    font-size: 34px;
    color: rgba(255,255,255,0.92);
    margin-top: 14px;
  }
  .langs {
    font-weight: 800;
    font-size: 23px;
    color: rgba(255,255,255,0.5);
    margin-top: 18px;
    letter-spacing: 0.3px;
  }
  .emojis {
    margin-top: 30px;
    font-size: 52px;
    line-height: 1;
    letter-spacing: 12px;
  }
</style>
</head>
<body>
  <div class="orb coral"></div>
  <div class="orb teal"></div>
  <div class="orb gold"></div>

  <div class="cloud">
    <!-- The Cloudmoji mascot, excited mood — transcribed from src/components/CloudMascot.tsx -->
    <svg viewBox="0 0 120 78" xmlns="http://www.w3.org/2000/svg">
      <circle cx="30" cy="46" r="20" fill="white" />
      <circle cx="52" cy="36" r="23" fill="white" />
      <circle cx="72" cy="30" r="26" fill="white" />
      <circle cx="94" cy="42" r="19" fill="white" />
      <circle cx="42" cy="44" r="16" fill="white" />
      <rect x="12" y="48" width="96" height="24" rx="12" fill="white" />
      <circle cx="72" cy="22" r="12" fill="#F8FCFF" />
      <circle cx="50" cy="30" r="8" fill="#F8FCFF" opacity="0.7" />
      <ellipse cx="60" cy="68" rx="44" ry="6" fill="#E8EEF4" opacity="0.4" />
      <ellipse cx="34" cy="58" rx="8" ry="4.5" fill="#FFB5B5" opacity="0.55" />
      <ellipse cx="86" cy="58" rx="8" ry="4.5" fill="#FFB5B5" opacity="0.55" />
      <!-- Happy face, exactly the iOS app icon: squinting arc eyes and a gentle
           smile, drawn as paths so they never shift with font availability. -->
      <path d="M39 53 Q46 46 53 53" fill="none" stroke="#2D3436" stroke-width="3" stroke-linecap="round" />
      <path d="M67 53 Q74 46 81 53" fill="none" stroke="#2D3436" stroke-width="3" stroke-linecap="round" />
      <path d="M53 61 Q60 67 67 61" fill="none" stroke="#2D3436" stroke-width="2.2" stroke-linecap="round" />
      <!-- Gold sparkles, the icon's celebration accent, as star paths not emoji. -->
      <g fill="#FFE66D">
        <path d="M110 8 l2.4 6.8 6.8 2.4 -6.8 2.4 -2.4 6.8 -2.4 -6.8 -6.8 -2.4 6.8 -2.4 z" opacity="0.9" />
        <path d="M9 22 l1.6 4.6 4.6 1.6 -4.6 1.6 -1.6 4.6 -1.6 -4.6 -4.6 -1.6 4.6 -1.6 z" opacity="0.6" />
      </g>
    </svg>
  </div>

  <div class="text">
    <div class="wordmark">Cloudmoji</div>
    <div class="tagline">Tap. Listen. Learn!</div>
    <div class="langs">English &middot; 中文 &middot; Bahasa &middot; 日本語 &middot; Tagalog</div>
    <div class="emojis">🍎&#8202;🐶&#8202;🎈&#8202;🚗&#8202;🌈</div>
  </div>
</body>
</html>
